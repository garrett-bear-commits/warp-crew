name: Deploy GitHub Pages (QA + game)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci || npm install
      - name: Test
        run: npm test
      - name: Build for GitHub Pages
        env:
          GITHUB_PAGES: '1'
        run: npm run build
      - name: Add QA as default landing (optional copy)
        run: |
          # Keep game at /warp-crew/ (index.html from Vite)
          # QA hub at /warp-crew/qa.html — also make /warp-crew/qa/ work
          cp dist/qa.html dist/qa-hub.html || true
          # Simple root note for browsers that open folder
          printf '%s\n' 'Warp Crew Pages build' > dist/BUILD.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
