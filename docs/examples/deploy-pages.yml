name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm test
      - name: Build (GitHub Pages base)
        env:
          GITHUB_PAGES: '1'
        run: npm run build
      - name: Prefer QA hub as site root index
        run: |
          # Keep game as play.html; QA hub becomes index for shareable link
          cp dist/index.html dist/play.html
          cp dist/qa.html dist/index.html
          # fix in-page play button already points to ./index.html in qa — update to play
          sed -i 's|href="./index.html"|href="./play.html"|g' dist/index.html || true
          sed -i 's|Play Warp Crew (this Pages build)|Play Warp Crew|g' dist/index.html || true
          ls -la dist
          test -f dist/index.html && test -f dist/play.html && test -f dist/qa.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
